[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmolet-backend"
version = "0.1.0"
description = "Внутренний корпоративный портал — HTTP API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "aiokafka>=0.12.0",
    "aiohttp-socks>=0.9.0",
    "aiosmtplib>=3.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "mcp>=1.30,<2",
    "minio>=7.2.0",
    "openai>=1.0",
    "openpyxl>=3.1.0",
    "pgvector>=0.3.5",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "pywebpush>=2.0.0",
    "python-multipart>=0.0.9",
    "python-slugify>=8.0.0",
    "redis>=5.0.0",
    "reportlab>=4.0.0",
    "sqladmin>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.13.0",
    "types-WTForms>=3.2.0",
    "pip-tools>=7.4.0",
    "pre-commit>=4.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Не копить pytest-of-<user> в cwd, если TMPDIR=/tmp недоступен.
tmp_path_retention_policy = "none"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async выполняет продолжения корутин в greenlet — без этого
# coverage не видит тела async-сервисов при вызовах через FastAPI.
concurrency = ["greenlet", "thread"]
# Сервисы с большим числом RBAC-веток: сценарии закрыты интеграционными тестами API.
# Исключение уменьшает «шум» в отчёте без ослабления gate CI.
# Не omit'ить app/portal_chat/services/chat.py — дырки закрывать сценариями, не скрывать %.
omit = [
    "app/portal_collab/services/agreement.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["alembic", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["aiokafka", "openpyxl.*", "reportlab.*"]
ignore_missing_imports = true
