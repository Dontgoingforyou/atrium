# SPA (Vite): fallback на index.html для клиентских маршрутов
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Заголовки безопасности — объявляются один раз и переиспользуются во всех location.
    # Важно: в nginx add_header из location ПОЛНОСТЬЮ заменяет add_header из server,
    # поэтому каждый location с собственными add_header обязан повторить все нужные заголовки.
    # Используем map-переменную как workaround: задаём заголовки через include-сниппет нельзя
    # без модуля headers_more, поэтому просто дублируем явно.

    # 'unsafe-inline' в script-src — inline-скрипт определения темы (FOUC prevention).
    # connect-src ограничен 'self' — убирает широкие https: и ws:; браузер отправит
    # ws/wss запросы на тот же origin автоматически через 'self'.

    # index.html — не кэшировать: браузер всегда проверяет наличие новой версии
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri /index.html;
    }

    # Хэшированные ассеты Vite — кэшировать навсегда (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # Все остальные маршруты — заголовки выставлены здесь напрямую
    # (нет своих add_header, поэтому server-уровневые не нужны, но для явности оставляем)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
