openapi: 3.1.0
info:
  title: Atrium API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - Служебное
      summary: Проверка живости процесса
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/auth/authorization-url:
    get:
      tags:
      - Авторизация
      summary: URL авторизации IdP (PKCE)
      operationId: authorization_url_api_v1_auth_authorization_url_get
      parameters:
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          description: Полный redirect_uri SPA (whitelist)
          title: Redirect Uri
        description: Полный redirect_uri SPA (whitelist)
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          title: Code Challenge
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
          default: S256
          title: Code Challenge Method
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Authorization Url Api V1 Auth Authorization Url Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Авторизация
      summary: Вход по email и паролю (прокси SSO)
      operationId: password_login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
