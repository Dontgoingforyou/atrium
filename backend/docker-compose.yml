name: cosmolet-backend-local

services:
  db:
    image: postgres:16-alpine
    container_name: cosmolet-backend-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: cosmolet
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cosmolet_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d cosmolet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dev:dev@db:5432/cosmolet}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
      APP_NAME: ${APP_NAME:-Cosmolet API}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

volumes:
  cosmolet_backend_pgdata:
