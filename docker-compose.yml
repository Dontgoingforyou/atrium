name: atrium-local

# Локальный Docker: web + api + gateway.
# Вход: http://127.0.0.1:9088/
# Прямой доступ: статика 9060, API 9062.
# Логи (Grafana + Loki): http://127.0.0.1:9090 (по умолчанию admin / admin).
# Из корня репозитория: docker compose up --build
#
# VITE_SPA_REDIRECT_URI при сборке web фиксирует OAuth callback на localhost:9088 (см. build.args).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: atrium-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: atrium
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - atrium_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d atrium"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_SPA_REDIRECT_URI: ${VITE_SPA_REDIRECT_URI:-http://localhost:9088/auth/callback}
    image: atrium-local-web:local
    container_name: atrium-local-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:9060:80"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atrium-local-api:local
    container_name: atrium-local-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:9062:8000"
    command:
      - sh
      - -c
      - |
        UV=$$(echo "$${LOG_LEVEL:-DEBUG}" | tr '[:upper:]' '[:lower:]')
        python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level "$$UV"
    environment:
      DEBUG: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dev:dev@db:5432/atrium}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TOKEN_CACHE_TTL: ${TOKEN_CACHE_TTL:-300}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-local-dev-secret-not-for-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9088,http://127.0.0.1:9088,http://localhost:9060,http://127.0.0.1:9060,http://localhost:5173,http://127.0.0.1:5173}
      APP_NAME: ${APP_NAME:-Atrium API (local)}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SSO_SERVICE_URL: ${SSO_SERVICE_URL:-}
      SSO_API_PREFIX: ${SSO_API_PREFIX:-/api/}
      SSO_AUTH_PAGE_PATH: ${SSO_AUTH_PAGE_PATH:-/auth}
      SSO_TOKEN_PATH: ${SSO_TOKEN_PATH:-auth/oauth2/token}
      SSO_REFRESH_PATH: ${SSO_REFRESH_PATH:-auth/refresh}
      SSO_USERINFO_PATH: ${SSO_USERINFO_PATH:-auth/me}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_CLIENT_ID_5173: ${SSO_CLIENT_ID_5173:-}
      SSO_CLIENT_SECRET_5173: ${SSO_CLIENT_SECRET_5173:-}
      SSO_CLIENT_ID_9088: ${SSO_CLIENT_ID_9088:-}
      SSO_CLIENT_SECRET_9088: ${SSO_CLIENT_SECRET_9088:-}
      SSO_CLIENT_ID_STAGE: ${SSO_CLIENT_ID_STAGE:-}
      SSO_CLIENT_SECRET_STAGE: ${SSO_CLIENT_SECRET_STAGE:-}
      SSO_CLIENT_ID_PROD: ${SSO_CLIENT_ID_PROD:-}
      SSO_CLIENT_SECRET_PROD: ${SSO_CLIENT_SECRET_PROD:-}
      SSO_ALLOWED_REDIRECT_URIS: ${SSO_ALLOWED_REDIRECT_URIS:-}
      SSO_SCOPES: ${SSO_SCOPES:-openid profile email}
      SSO_GROUPS_CLAIM: ${SSO_GROUPS_CLAIM:-groups}
      # * только локально за nginx; образ и prod/staging — CIDR .
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      CALENDAR_SERVICE_URL: ${CALENDAR_SERVICE_URL:-http://host.docker.internal:8010}
      CALENDAR_PRODUCT: ${CALENDAR_PRODUCT:-atrium}
      CALENDAR_KAFKA_BOOTSTRAP_SERVERS: ${CALENDAR_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      CALENDAR_KAFKA_TOPIC: ${CALENDAR_KAFKA_TOPIC:-calendar}
      CALENDAR_KAFKA_GROUP: ${CALENDAR_KAFKA_GROUP:-atrium-calendar}
      TELEGRAM_USE_POLLING: ${TELEGRAM_USE_POLLING:-true}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:9088}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/tg/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_PERSONAL_ACCESS_TOKEN: ${JIRA_PERSONAL_ACCESS_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_BOARD_ID: ${JIRA_BOARD_ID:-0}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      JIRA_SEARCH_RATE_LIMIT: ${JIRA_SEARCH_RATE_LIMIT:-30}
      JIRA_SEARCH_RATE_WINDOW_SECONDS: ${JIRA_SEARCH_RATE_WINDOW_SECONDS:-60}
      JIRA_WEBHOOK_DEBOUNCE_SECONDS: ${JIRA_WEBHOOK_DEBOUNCE_SECONDS:-20}
      JIRA_TASKS_PROJECT_KEY: ${JIRA_TASKS_PROJECT_KEY:-}
      JIRA_TASKS_BOARD_ID: ${JIRA_TASKS_BOARD_ID:-0}
      JIRA_TASKS_SYNC_ENABLED: ${JIRA_TASKS_SYNC_ENABLED:-false}
      JIRA_TASKS_ISSUE_TYPE: ${JIRA_TASKS_ISSUE_TYPE:-Задача}
      GOOGLE_SHEETS_SYNC_ENABLED: ${GOOGLE_SHEETS_SYNC_ENABLED:-false}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_SYNC_INTERVAL_SECONDS: ${GOOGLE_SHEETS_SYNC_INTERVAL_SECONDS:-60}
      GOOGLE_SHEETS_STALE_AFTER_SECONDS: ${GOOGLE_SHEETS_STALE_AFTER_SECONDS:-900}
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: "${GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON:-}"
      GOOGLE_SHEETS_TIMEOUT_SECONDS: ${GOOGLE_SHEETS_TIMEOUT_SECONDS:-20}
      PROFILE_DIRECTORY_BASE_URL: ${PROFILE_DIRECTORY_BASE_URL:-}
      PROFILE_DIRECTORY_SERVICE_TOKEN: ${PROFILE_DIRECTORY_SERVICE_TOKEN:-}
      USER_PHOTO_URL_TTL_SECONDS: ${USER_PHOTO_URL_TTL_SECONDS:-3600}
      USER_PHOTO_META_CACHE_SECONDS: ${USER_PHOTO_META_CACHE_SECONDS:-300}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9063}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-attachments}
      MINIO_INTERNAL_SECURE: ${MINIO_INTERNAL_SECURE:-false}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DOCUMENT_TRASH_PURGE_ENABLED: ${DOCUMENT_TRASH_PURGE_ENABLED:-true}
      DOCUMENT_TRASH_PURGE_HOUR_UTC: ${DOCUMENT_TRASH_PURGE_HOUR_UTC:-3}
      DOCUMENT_COLLAB_ENABLED: ${DOCUMENT_COLLAB_ENABLED:-true}
      DOCUMENT_COLLAB_SERVICE_TOKEN: ${DOCUMENT_COLLAB_SERVICE_TOKEN:-local-collab-dev-token}
      BENCH_EXPORT_SERVICE_TOKEN: ${BENCH_EXPORT_SERVICE_TOKEN:-local-bench-export-token}
      BENCH_EXPORT_DOCUMENT_ID: ${BENCH_EXPORT_DOCUMENT_ID:-60629368-c9e8-492c-9def-67e3c4aa092c}
      BENCH_EXPORT_RATE_LIMIT: ${BENCH_EXPORT_RATE_LIMIT:-60}
      BENCH_EXPORT_RATE_WINDOW_SECONDS: ${BENCH_EXPORT_RATE_WINDOW_SECONDS:-60}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-}
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  document-collab:
    build:
      context: ./services/document-collab
      dockerfile: Dockerfile
    image: atrium-local-document-collab:local
    container_name: atrium-local-document-collab
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "1234"
      ATRIUM_API_BASE_URL: ${ATRIUM_API_BASE_URL:-http://api:8000/api/v1}
      DOCUMENT_COLLAB_SERVICE_TOKEN: ${DOCUMENT_COLLAB_SERVICE_TOKEN:-local-collab-dev-token}
      DOCUMENT_COLLAB_STORE_DEBOUNCE_MS: ${DOCUMENT_COLLAB_STORE_DEBOUNCE_MS:-2000}
    expose:
      - "1234"

  redis:
    image: redis:7-alpine
    container_name: atrium-local-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: atrium-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9063:9000"   # S3 API
      - "127.0.0.1:9064:9001"   # Веб-консоль
    volumes:
      - atrium_local_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:2.9.4
    container_name: atrium-local-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - atrium_local_loki:/loki

  promtail:
    image: grafana/promtail:2.9.4
    container_name: atrium-local-promtail
    restart: unless-stopped
    user: root
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    container_name: atrium-local-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:9090:3000"
    volumes:
      - atrium_local_grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

  gateway:
    image: nginx:alpine
    container_name: atrium-local-gateway
    restart: unless-stopped
    ports:
      - "9088:80"
    volumes:
      - ./deploy/nginx/gateway.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  atrium_local_pgdata:
  atrium_local_redis:
  atrium_local_minio:
  atrium_local_loki:
  atrium_local_grafana:
