        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Авторизация
      summary: Текущий пользователь (Bearer access token)
      description: Профиль с актуальными ролями портала из БД.
      operationId: me_api_v1_auth_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/admin-session:
    post:
      tags:
      - Авторизация
      summary: Сессия SQLAdmin по Bearer токену портала (JSON с URL для перехода)
      description: 'Одна точка OAuth у SPA; панель /admin открывается по cookie после
        проверки

        is_portal_admin (группа atrium_role_admin в профиле SSO, как у /auth/me).


        Ответ JSON, а не HTTP-редирект: иначе fetch с redirect=follow получает 200
        от HTML /admin/

        и фронт не может обработать переход.'
      operationId: admin_session_api_v1_auth_admin_session_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Admin Session Api V1 Auth Admin Session Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Авторизация
      summary: 'Выход: инвалидация токена в SSO и кэше Redis'
      description: 'Вызывается кнопкой «Выход» в SPA.

        1. Удаляет токен из Redis-кэша (мгновенно).

        2. Уведомляет SSO-шлюз — инвалидирует refresh_token в IdP (best-effort).

        3. Сбрасывает httpOnly cookie refresh-токена.'
      operationId: logout_api_v1_auth_logout_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout-beacon:
    post:
      tags:
      - Авторизация
      summary: Выход через sendBeacon (закрытие вкладки)
      description: 'Вызывается через `sendBeacon` на beforeunload (закрытие вкладки,
        F5, уход по ссылке).


        Только сбрасывает Redis-кэш userinfo для этого access_token — без вызова SSO
        logout:

        иначе любой refresh страницы или «На сайт» из админки ломал бы сессию в IdP.


        Полный выход из SSO — только POST /auth/logout (кнопка «Выход»). Cookie SQLAdmin
        не трогаем.


        Безопасность: sendBeacon не поддерживает заголовки Authorization, поэтому
        принимаем

        токен в теле. Проверяем JWT-формат (`is_plausible_jwt`) чтобы предотвратить
        массовую

        инвалидацию кэша произвольными строками.'
      operationId: logout_beacon_api_v1_auth_logout_beacon_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutBeaconRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
